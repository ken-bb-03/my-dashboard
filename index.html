<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>くらしの情報</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 12px; background: #f5f5f5; color: #333;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue",
        "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
    }
    .dashboard { max-width: 600px; margin: 0 auto; }
    .current-time { display: flex; align-items: baseline; gap: 10px; margin: 0 0 10px; line-height: 1.2; }
    .current-date-time { font-size: 1.45rem; font-weight: 700; color: #222; }
    .last-update { margin-left: auto; font-size: .85rem; font-weight: 400; color: #888; white-space: nowrap; }
    .day-card {
      position: relative; margin-bottom: 12px; padding: 12px; background: #fff;
      border: 2px solid transparent; border-radius: 18px; box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }
    .day-header { display: flex; align-items: flex-start; justify-content: space-between; min-height: 32px; }
    .day-date { margin: 0 0 8px; font-size: 1.2rem; font-weight: 700; }
    /* 非表示中も場所だけ確保し、Todayの有無でカードの寸法が変わらないようにします。 */
    .today-label { margin: 2px 0 0; font-size: .75rem; font-weight: 700; letter-spacing: .08em; color: #555; visibility: hidden; }
    .today-label.is-visible { visibility: visible; }
    .day-card.saturday { background: #edf6ff; border-color: #8fc2ef; }
    .day-card.sunday-or-holiday { background: #fff0f0; border-color: #efa2a2; }
    .day-date.saturday, .day-date.sunday-or-holiday { color: #222; }
    .holiday-name { font-size: .9rem; font-weight: 600; }
    .info-card { padding: 10px 14px; border-radius: 14px; background: #fff; }
    /* 左側を少し細くして、アイコン横の空きすぎる余白を減らします。 */
    .weather-layout { display: grid; grid-template-columns: 42% 58%; align-items: center; }
    .weather-summary { display: flex; flex-direction: row; align-items: center; justify-content: flex-start; gap: 8px; }
    /* すべての天気画像に同じ表示領域を使い、種類でカードの高さが変わらないようにします。 */
    .weather-icon { display: flex; align-items: center; justify-content: center; flex: 0 0 62px; width: 62px; height: 62px; }
    .weather-image { display: block; width: 58px; height: 58px; object-fit: contain; }
    .weather-unknown-icon { font-size: 2rem; font-weight: 400; color: #777; }
    .weather-sun { filter: sepia(1) saturate(7) hue-rotate(325deg) brightness(.9); }
    .weather-cloud { filter: grayscale(1) brightness(.85); }
    .weather-rain { filter: sepia(1) saturate(5) hue-rotate(155deg) brightness(.85); }
    .weather-snow { filter: sepia(1) saturate(3.5) hue-rotate(145deg) brightness(.9); }
    .weather-thunder { filter: sepia(1) saturate(6) hue-rotate(235deg) brightness(.85); }
    .main-info { margin: 8px 0 0; font-size: 1.25rem; font-weight: 700; }
    .weather-summary .main-info { margin: 0; }
    .weather-details { padding-left: 12px; border-left: 1px solid #ddd; }
    .temperature, .precipitation { margin: 0; font-size: 1rem; font-weight: 700; line-height: 1.35; color: #222; }
    .temperature-value { font-size: inherit; font-weight: inherit; }
    .precipitation { margin-top: 3px; }
    /* ごみの種類が1つでも複数でも、囲む枠の高さを一定に保ちます。 */
    .garbage-card { height: 86px; margin-top: 8px; }
    .garbage-card .main-info { height: 100%; margin: 0; min-height: 0; font-size: 1rem; }
    .garbage-list { display: grid; height: 100%; align-content: center; gap: 2px; }
    .garbage-row { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: clamp(.7rem, 2.3vw, 1rem); font-weight: 700; line-height: 1.15; white-space: nowrap; }
    .garbage-row .garbage-image { flex: 0 0 auto; width: 24px; height: 24px; }
    .garbage-list.single .garbage-row { font-size: 1rem; }
    .garbage-list.single .garbage-image { width: 40px; height: 40px; }
    .garbage-no-collection { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; color: #777; font-size: 1.2rem; font-weight: 400; }
    .garbage-image { display: block; width: 32px; height: 32px; object-fit: contain; }
    .garbage-symbol .garbage-image { width: 44px; height: 44px; }
    .week-garbage { margin-top: 10px; padding: 10px; background: #fff; border-radius: 18px; box-shadow: 0 3px 12px rgba(0,0,0,.08); }
    .week-garbage-header { position: relative; display: flex; align-items: center; margin-bottom: 6px; }
    .week-garbage-month { margin: 0; font-size: 1.1rem; font-weight: 700; letter-spacing: .04em; color: #222; }
    .week-navigation { display: flex; gap: 6px; margin-left: auto; }
    .week-navigation button { display: grid; place-items: center; width: 30px; height: 30px; padding: 0; border: 1px solid #cbd5e1; border-radius: 8px; background: #fff; color: #222; font-size: .85rem; line-height: 1; cursor: pointer; }
    .week-navigation button:disabled { cursor: default; opacity: .35; }
    .week-return-row { display: flex; justify-content: flex-end; margin-top: 8px; }
    .return-today-button { padding: 5px 10px; border: 1px solid #cbd5e1; border-radius: 7px; background: #fff; color: #555; font-size: .75rem; cursor: pointer; }
    .week-garbage-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
    /* 高さを固定せず、曜日とアイコンに必要な分だけの高さにします。 */
    .garbage-day { display: flex; flex-direction: column; align-items: center; height: 96px; padding: 6px 4px; border: 1px solid #d1d5db; border-radius: 10px; background: #fff; text-align: center; }
    .garbage-day { cursor: pointer; }
    .garbage-day.selected { border: 2px solid #111; background: #fff; }
    .garbage-day.saturday { background: #edf6ff; border-color: #8fc2ef; }
    .garbage-day.sunday-or-holiday { background: #fff0f0; border-color: #efa2a2; }
    .garbage-day.selected { border-color: #111; }
    .garbage-day.selected.saturday, .garbage-day.selected.sunday-or-holiday { box-shadow: inset 0 0 0 1px #111; }
    .garbage-day-date { margin: 0 0 2px; font-size: 1rem; font-weight: 700; color: #222; }
    .garbage-day-weekday { margin: 0 0 6px; font-size: .7rem; font-weight: 700; letter-spacing: .06em; color: #222; }
    .garbage-day-type { display: flex; align-items: center; justify-content: center; gap: 1px; min-height: 36px; margin: 0; font-size: 1.8rem; line-height: 1.4; }
    .garbage-day-type .garbage-image { width: 28px; height: 28px; }
    .garbage-day-type.multiple .garbage-image { width: 18px; height: 18px; }
    .garbage-day-type.pending { color: #777; font-size: 1.15rem; font-weight: 500; }
    .status { margin-top: 8px; font-size: .8rem; color: #777; text-align: center; }

    /* iPadの分割表示など、縦方向が限られる画面では余白をさらに減らします。 */
    @media (max-width: 700px) {
      body { padding: 8px; }
      .current-time { margin-bottom: 6px; }
      .current-date-time { font-size: 1.2rem; }
      .last-update { font-size: .7rem; }
      .day-card { margin-bottom: 8px; padding: 10px; }
      .day-header { min-height: 28px; }
      .day-date { margin-bottom: 5px; font-size: 1.05rem; }
      .info-card { padding: 8px 12px; }
      .weather-icon { flex-basis: 52px; width: 52px; height: 52px; }
      .weather-image { width: 48px; height: 48px; }
      .temperature, .precipitation { font-size: .9rem; }
      .precipitation { margin-top: 1px; }
      .garbage-card { height: 72px; margin-top: 5px; }
      .garbage-row { gap: 5px; font-size: clamp(.62rem, 2.4vw, .85rem); }
      .garbage-row .garbage-image { width: 20px; height: 20px; }
      .garbage-list.single .garbage-image { width: 34px; height: 34px; }
      .week-garbage { margin-top: 8px; padding: 8px; }
      .garbage-day { height: 88px; padding: 5px 3px; }
      .garbage-day-type { min-height: 30px; }
      .garbage-day-type .garbage-image { width: 24px; height: 24px; }
      .garbage-day-type.multiple .garbage-image { width: 16px; height: 16px; }
      .week-return-row { margin-top: 5px; }
      .status { margin-top: 4px; font-size: .7rem; }
    }
  </style>
</head>
<body>
  <main class="dashboard">
    <p class="current-time" id="current-time" aria-label="現在時刻"></p>
    <section class="day-card">
      <div class="day-header">
        <h2 class="day-date" id="today-date"></h2>
        <p class="today-label" id="today-label">Today</p>
      </div>
      <section class="info-card weather-card">
        <div class="weather-layout">
          <div class="weather-summary">
            <span class="weather-icon" id="today-weather-icon" aria-hidden="true">…</span>
            <p class="main-info" id="today-weather">読み込んでいます…</p>
          </div>
          <div class="weather-details">
            <p class="temperature" id="today-temperature"></p>
            <p class="precipitation" id="today-precipitation"></p>
          </div>
        </div>
      </section>
      <section class="info-card garbage-card">
        <p class="main-info" id="today-garbage"></p>
      </section>
    </section>

    <section class="day-card">
      <div class="day-header">
        <h2 class="day-date" id="tomorrow-date"></h2>
        <p class="today-label" aria-hidden="true">Today</p>
      </div>
      <section class="info-card weather-card">
        <div class="weather-layout">
          <div class="weather-summary">
            <span class="weather-icon" id="tomorrow-weather-icon" aria-hidden="true">…</span>
            <p class="main-info" id="tomorrow-weather">読み込んでいます…</p>
          </div>
          <div class="weather-details">
            <p class="temperature" id="tomorrow-temperature"></p>
            <p class="precipitation" id="tomorrow-precipitation"></p>
          </div>
        </div>
      </section>
      <section class="info-card garbage-card">
        <p class="main-info" id="tomorrow-garbage"></p>
      </section>
    </section>
    
    <section class="week-garbage">
      <div class="week-garbage-header">
        <p class="week-garbage-month" id="week-garbage-month"></p>
        <div class="week-navigation" aria-label="週間ごみ予定の移動">
          <button type="button" id="previous-week" aria-label="前の7日間">◀</button>
          <button type="button" id="next-week" aria-label="次の7日間">▶</button>
        </div>
      </div>
      <div class="week-garbage-grid" id="week-garbage"></div>
      <div class="week-return-row">
        <button type="button" class="return-today-button" id="return-today">今日に戻る</button>
      </div>
    </section>
    <p class="status" id="status"></p>
  </main>

  <script>
    // 最初に選ばれている日は今日です。下の週間欄を押すと、この日が変わります。
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    let selectedDate = new Date(today);
    let weekStartDate = new Date(today);
    let returnToTodayTimer;
    let lastWeatherUpdateTime = "--:--";

    // 2026年の日本の祝日・休日です。
    // 翌年になったら、内閣府が公表する一覧をもとにこの部分を更新します。
    const holidays2026 = {
      "2026-01-01": "元日",
      "2026-01-12": "成人の日",
      "2026-02-11": "建国記念の日",
      "2026-02-23": "天皇誕生日",
      "2026-03-20": "春分の日",
      "2026-04-29": "昭和の日",
      "2026-05-03": "憲法記念日",
      "2026-05-04": "みどりの日",
      "2026-05-05": "こどもの日",
      "2026-05-06": "休日",
      "2026-07-20": "海の日",
      "2026-08-11": "山の日",
      "2026-09-21": "敬老の日",
      "2026-09-22": "休日",
      "2026-09-23": "秋分の日",
      "2026-10-12": "スポーツの日",
      "2026-11-03": "文化の日",
      "2026-11-23": "勤労感謝の日"
    };

    const weatherUrl =
      "https://api.open-meteo.com/v1/forecast" +
      "?latitude=36.43&longitude=139.91" +
      "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max" +
      "&timezone=Asia%2FTokyo&forecast_days=16";

    // 取得済みの天気データを覚えておき、日付を押したときに使います。
    let latestDailyWeather;

    function formatDate(date) {
      return new Intl.DateTimeFormat("ja-JP", {
        month: "long", day: "numeric", weekday: "short"
      }).format(date);
    }

    // 最終更新時刻を「9:05」の形にします。
    function formatUpdateTime(date) {
      return new Intl.DateTimeFormat("ja-JP", {
        hour: "numeric", minute: "2-digit"
      }).format(date);
    }

    // 上部の時計を「7:45」の形で表示します。
    function updateClock() {
      const now = new Date();
      const dateText = now.getFullYear() + "/" +
        String(now.getMonth() + 1).padStart(2, "0") + "/" +
        String(now.getDate()).padStart(2, "0");
      const weekday = new Intl.DateTimeFormat("en-US", { weekday: "short" }).format(now) + ".";
      const time = new Intl.DateTimeFormat("ja-JP", {
        hour: "numeric", minute: "2-digit", hourCycle: "h23"
      }).format(now);
      const dateTime = document.createElement("span");
      dateTime.className = "current-date-time";
      dateTime.textContent = `${dateText}(${weekday})　${time}`;
      const updateTime = document.createElement("span");
      updateTime.className = "last-update";
      updateTime.textContent = `更新時間${lastWeatherUpdateTime}`;
      document.getElementById("current-time").replaceChildren(
        dateTime,
        updateTime
      );
    }

    // 日付を祝日一覧と照合できる「2026-09-13」の形にします。
    function dateKey(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    // 日付の色と、祝日名を日付見出しへ反映します。
    function displayDayDate(elementId, date) {
      const element = document.getElementById(elementId);
      const dayCard = element.closest(".day-card");
      const holidayName = holidays2026[dateKey(date)];

      element.textContent = formatDate(date);
      element.classList.remove("saturday", "sunday-or-holiday");
      dayCard.classList.remove("saturday", "sunday-or-holiday");

      if (holidayName || date.getDay() === 0) {
        element.classList.add("sunday-or-holiday");
        dayCard.classList.add("sunday-or-holiday");
      } else if (date.getDay() === 6) {
        element.classList.add("saturday");
        dayCard.classList.add("saturday");
      }

      if (holidayName) {
        const holidayLabel = document.createElement("span");
        holidayLabel.className = "holiday-name";
        holidayLabel.textContent = `　${holidayName}`;
        element.appendChild(holidayLabel);
      }
    }

    function addDays(date, numberOfDays) {
      const result = new Date(date);
      result.setDate(result.getDate() + numberOfDays);
      return result;
    }

    // 収集場所の看板に書かれていた、毎月繰り返すごみ収集ルールです。
    // 日曜日は0、月曜日は1…土曜日は6を表します。
    function garbageForDate(date) {
      const weekday = date.getDay();
      const weekNumber = Math.floor((date.getDate() - 1) / 7) + 1;

      if (weekday === 1) return ["プラスチック・白トレイ"];
      if (weekday === 2 || weekday === 5) return ["燃やせるごみ"];

      if (weekday === 3) {
        if (weekNumber === 1) {
          return ["不燃ごみ", "紙類・布類・ビールびん・一升瓶", "危険ごみ"];
        }
        if (weekNumber === 3) return ["不燃ごみ"];
        if (weekNumber === 2 || weekNumber === 4) {
          return ["びん・缶類・ペットボトル"];
        }
      }

      if (weekday === 4 && weekNumber === 3) {
        return ["紙類・布類・ビールびん・一升瓶"];
      }
      return [];
    }

    // 選択中の7日間のごみ情報の枠を作ります。
    function displayWeeklyGarbage() {
      const container = document.getElementById("week-garbage");
      const monthLabel = document.getElementById("week-garbage-month");
      container.replaceChildren();
      const lastDate = addDays(weekStartDate, 6);
      const formatMonth = (date) => {
        const japaneseMonth = new Intl.DateTimeFormat("ja-JP", {
          month: "numeric"
        }).format(date);
        const englishMonth = new Intl.DateTimeFormat("en-US", {
          month: "long"
        }).format(date);
        return `${japaneseMonth} ${englishMonth}`;
      };
      monthLabel.textContent = weekStartDate.getMonth() === lastDate.getMonth()
        ? formatMonth(weekStartDate)
        : `${formatMonth(weekStartDate)} / ${formatMonth(lastDate)}`;
      for (let offset = 0; offset < 7; offset += 1) {
        const date = addDays(weekStartDate, offset);

        const card = document.createElement("article");
        card.className = "garbage-day";
        card.tabIndex = 0;
        card.setAttribute("role", "button");
        card.setAttribute("aria-label", `${formatDate(date)}を表示`);
        if (dateKey(date) === dateKey(selectedDate)) card.classList.add("selected");

        const weekday = document.createElement("p");
        weekday.className = "garbage-day-weekday";
        weekday.textContent = new Intl.DateTimeFormat("en-US", {
          weekday: "short"
        }).format(date) + ".";

        const dayNumber = document.createElement("p");
        dayNumber.className = "garbage-day-date";
        dayNumber.textContent = date.getDate();

        if (holidays2026[dateKey(date)] || date.getDay() === 0) {
          weekday.classList.add("sunday-or-holiday");
          card.classList.add("sunday-or-holiday");
        } else if (date.getDay() === 6) {
          weekday.classList.add("saturday");
          card.classList.add("saturday");
        }

        const garbageType = document.createElement("p");
        garbageType.className = "garbage-day-type";

        const garbageTypes = garbageForDate(date);
        if (garbageTypes.length > 0) {
          if (garbageTypes.length > 1) garbageType.classList.add("multiple");
          for (const type of garbageTypes) {
            garbageType.appendChild(createGarbageImage(type));
          }
          garbageType.title = garbageTypes.join("・");
          garbageType.setAttribute("aria-label", garbageTypes.join("・"));
        } else {
          garbageType.textContent = "—";
          garbageType.classList.add("pending");
          garbageType.title = "収集なし";
          garbageType.setAttribute("aria-label", "収集なし");
        }

        card.append(dayNumber, weekday, garbageType);
        card.addEventListener("click", () => selectDate(date));
        card.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            selectDate(date);
          }
        });
        container.appendChild(card);
      }
    }

    // ごみの種類と、添付された画像ファイルを対応づけます。
    function garbageImageFile(type) {
      if (type.includes("燃やせる")) return "burnable.png";
      if (type.includes("プラスチック")) return "plastic-trays.png";
      if (type.includes("不燃")) return "nonburnable.png";
      if (type.includes("紙") || type.includes("布") || type.includes("一升")) {
        return "paper-cloth-returnable.png";
      }
      if (type.includes("危険")) return "hazardous.png";
      if (type.includes("びん") || type.includes("缶") || type.includes("ペット")) {
        return "bottles-cans-pet.png";
      }
      return "nonburnable.png";
    }

    function createGarbageImage(type) {
      const image = document.createElement("img");
      image.className = "garbage-image";
      image.src = "images/garbage/" + garbageImageFile(type);
      image.alt = "";
      return image;
    }

    // 今日・明日のごみ欄では、種類ごとにアイコンと名前を1行ずつ表示します。
    function displayGarbage(elementId, types) {
      const element = document.getElementById(elementId);
      const list = document.createElement("div");
      list.className = "garbage-list";

      if (types.length > 0) {
        for (const type of types) {
          const row = document.createElement("div");
          row.className = "garbage-row";
          row.append(createGarbageImage(type), document.createTextNode(type));
          list.appendChild(row);
        }
      } else {
        const row = document.createElement("div");
        row.className = "garbage-row";
        const noCollection = document.createElement("span");
        noCollection.className = "garbage-no-collection";
        noCollection.textContent = "—";
        row.append(noCollection, document.createTextNode("収集なし"));
        list.appendChild(row);
      }

      if (types.length <= 1) list.classList.add("single");
      element.replaceChildren(list);
    }

    // 上の2枚のカードを、選択中の日と翌日の内容に切り替えます。
    function displaySelectedDateCards() {
      const nextDate = addDays(selectedDate, 1);
      const isTodaySelected = dateKey(selectedDate) === dateKey(today);
      const firstGarbage = garbageForDate(selectedDate);
      const secondGarbage = garbageForDate(nextDate);

      displayDayDate("today-date", selectedDate);
      displayDayDate("tomorrow-date", nextDate);
      document.getElementById("today-label").classList.toggle("is-visible", isTodaySelected);
      displayGarbage("today-garbage", firstGarbage);
      displayGarbage("tomorrow-garbage", secondGarbage);

      if (latestDailyWeather) displaySelectedWeather();
    }

    function displaySelectedWeather() {
      const weatherIndex = latestDailyWeather.time.indexOf(dateKey(selectedDate));
      if (weatherIndex < 0 || weatherIndex + 1 >= latestDailyWeather.time.length) {
        displayUnknownWeather("today");
        displayUnknownWeather("tomorrow");
        return;
      }

      displayWeather(weatherIndex, latestDailyWeather, "today");
      displayWeather(weatherIndex + 1, latestDailyWeather, "tomorrow");
    }

    function displayUnknownWeather(prefix) {
      const icon = document.createElement("span");
      icon.className = "weather-unknown-icon";
      icon.textContent = "？";
      document.getElementById(prefix + "-weather-icon").replaceChildren(icon);
      document.getElementById(prefix + "-weather").textContent = "不明";
      document.getElementById(prefix + "-temperature").textContent = "";
      document.getElementById(prefix + "-precipitation").textContent = "";
    }

    // 画面全体を、最初の「今日からの表示」に戻します。
    function returnToToday() {
      clearTimeout(returnToTodayTimer);
      selectedDate = new Date(today);
      weekStartDate = new Date(today);
      displaySelectedDateCards();
      displayWeeklyGarbage();
      returnToTodayTimer = undefined;
    }

    function scheduleReturnToToday() {
      clearTimeout(returnToTodayTimer);
      returnToTodayTimer = setTimeout(returnToToday, 60 * 1000);
    }

    // 下の週間欄を押したときに呼ばれます。
    function selectDate(date) {
      selectedDate = new Date(date);
      displaySelectedDateCards();
      displayWeeklyGarbage();

      if (dateKey(selectedDate) !== dateKey(today)) {
        scheduleReturnToToday();
      } else {
        clearTimeout(returnToTodayTimer);
      }
    }

    function showPreviousWeek() {
      weekStartDate = addDays(weekStartDate, -7);
      displayWeeklyGarbage();
      scheduleReturnToToday();
    }

    function showNextWeek() {
      weekStartDate = addDays(weekStartDate, 7);
      displayWeeklyGarbage();
      scheduleReturnToToday();
    }

    function weatherLabel(code) {
      // 天気の細かな種類を、見やすい5種類へまとめます。
      if ([0,1,2].includes(code)) return "晴れ";
      if ([3,45,48].includes(code)) return "くもり";
      if ([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code)) return "雨";
      if ([71,73,75,77,85,86].includes(code)) return "雪";
      if ([95,96,99].includes(code)) return "雷雨";
      return "不明";
    }

    function weatherIcon(code) {
      if ([0,1,2].includes(code)) return "sun";
      if ([3,45,48].includes(code)) return "cloud";
      if ([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code)) return "rain";
      if ([71,73,75,77,85,86].includes(code)) return "snow";
      if ([95,96,99].includes(code)) return "thunder";
      return "sun";
    }

    function displayWeather(index, daily, prefix) {
      const code = daily.weather_code[index];
      const max = Math.round(daily.temperature_2m_max[index]);
      const min = Math.round(daily.temperature_2m_min[index]);
      const rain = daily.precipitation_probability_max[index];

      const iconName = weatherIcon(code);
      const iconImage = document.createElement("img");
      iconImage.className = "weather-image weather-" + iconName;
      iconImage.src = "images/weather/" + iconName + ".png";
      iconImage.alt = "";
      document.getElementById(prefix + "-weather-icon").replaceChildren(iconImage);
      document.getElementById(prefix + "-weather").textContent = weatherLabel(code);
      document.getElementById(prefix + "-temperature").innerHTML =
        "最高 <span class=\"temperature-value\">" + max + "℃</span><br>" +
        "最低 <span class=\"temperature-value\">" + min + "℃</span>";
      document.getElementById(prefix + "-precipitation").textContent =
        "降水確率　" + rain + "%";
    }

    async function updateWeather() {
      const status = document.getElementById("status");
      try {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 10000);
        const response = await fetch(weatherUrl, { signal: controller.signal });
        clearTimeout(timeout);

        if (!response.ok) throw new Error("天気情報の取得に失敗しました");
        const data = await response.json();
        if (!data.daily || data.daily.weather_code.length < 2) {
          throw new Error("天気データがありません");
        }

        latestDailyWeather = data.daily;
        displaySelectedWeather();
        lastWeatherUpdateTime = formatUpdateTime(new Date());
        updateClock();
        status.textContent = "";
      } catch (error) {
        console.error(error);
        displayUnknownWeather("today");
        displayUnknownWeather("tomorrow");
        status.textContent = "天気情報の取得に失敗しました。時間をおいて再読み込みしてください。";
      }
    }

    updateClock();
    displaySelectedDateCards();
    displayWeeklyGarbage();
    updateWeather();

    document.getElementById("previous-week").addEventListener("click", showPreviousWeek);
    document.getElementById("next-week").addEventListener("click", showNextWeek);
    document.getElementById("return-today").addEventListener("click", returnToToday);

    // 画面を開いている間は、30分ごとに天気を取り直します。
    setInterval(updateWeather, 30 * 60 * 1000);
    // 時計は毎秒更新します。
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
