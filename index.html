<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>くらしの情報</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      background: #ffffff;
      color: #111111;
      font-family: -apple-system, BlinkMacSystemFont, "Yu Gothic", "Meiryo", sans-serif;
    }

    .dashboard {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
    }

    .dashboard h1 {
      margin: 0 0 18px;
      font-size: 32px;
      text-align: center;
      letter-spacing: 0.08em;
    }

    .day-card {
      margin-bottom: 18px;
      overflow: hidden;
      border: 2px solid #111111;
      border-radius: 10px;
      background: #ffffff;
    }

    .day-date {
      margin: 0;
      padding: 16px 18px;
      border-bottom: 2px solid #111111;
      font-size: 30px;
    }

    .info-card {
      position: relative;
      margin: 0;
      padding: 16px 100px 16px 18px;
      border-bottom: 1px solid #d1d5db;
    }

    .info-card:last-child { border-bottom: 0; }

    .info-card h3 {
      margin: 0;
      font-size: 18px;
    }

    .info-card p {
      margin: 6px 0 0;
      font-size: 18px;
    }

    .info-card .place {
      color: #4b5563;
      font-size: 15px;
    }

    .info-card .main-info {
      font-size: 26px;
      font-weight: bold;
    }

    .weather-card { border-left: 7px solid #555555; }

    .weather-card h3,
    .weather-icon { color: #555555; }

    .weather-icon {
      position: absolute;
      top: 50%;
      right: 24px;
      font-size: 62px;
      line-height: 1;
      transform: translateY(-50%);
    }

    .weather-card.sunny { border-left-color: #d12d2d; }
    .weather-card.sunny h3,
    .weather-card.sunny .weather-icon { color: #d12d2d; }

    .weather-card.cloudy { border-left-color: #6b7280; }
    .weather-card.cloudy h3,
    .weather-card.cloudy .weather-icon { color: #6b7280; }

    .weather-card.rainy,
    .weather-card.stormy { border-left-color: #1677c8; }

    .weather-card.rainy h3,
    .weather-card.rainy .weather-icon,
    .weather-card.stormy h3,
    .weather-card.stormy .weather-icon { color: #1677c8; }

    .weather-card.snowy { border-left-color: #557a95; }
    .weather-card.snowy h3,
    .weather-card.snowy .weather-icon { color: #557a95; }

    .garbage-card { padding-right: 18px; }

    .status {
      margin: 0 0 18px;
      padding: 10px 14px;
      border-radius: 8px;
      background: #f3f4f6;
      color: #4b5563;
      font-size: 14px;
      text-align: center;
    }

    .hidden { display: none; }

    @media (max-width: 480px) {
      body { padding: 12px; }
      .dashboard h1 { font-size: 27px; }
      .day-date { font-size: 25px; }
      .info-card { padding-right: 80px; }
      .weather-icon { right: 16px; font-size: 50px; }
    }
  </style>
</head>

<body class="dashboard-page">
  <main class="dashboard">
    <h1>くらしの情報</h1>

    <p id="status" class="status">天気情報を読み込んでいます…</p>

    <section class="day-card">
      <h2 class="day-date" id="today-date"></h2>

      <section class="info-card weather-card" id="today-weather-card">
        <span class="weather-icon" id="today-weather-icon" aria-hidden="true">…</span>
        <h3>天気</h3>
        <p class="place">上三川町付近</p>
        <p class="main-info" id="today-weather">読み込んでいます…</p>
        <p id="today-temperature"></p>
      </section>

      <section class="info-card garbage-card">
        <h3>ごみ</h3>
        <p class="main-info" id="today-garbage"></p>
      </section>
    </section>

    <section class="day-card">
      <h2 class="day-date" id="tomorrow-date"></h2>

      <section class="info-card weather-card" id="tomorrow-weather-card">
        <span class="weather-icon" id="tomorrow-weather-icon" aria-hidden="true">…</span>
        <h3>天気</h3>
        <p class="place">上三川町付近</p>
        <p class="main-info" id="tomorrow-weather">読み込んでいます…</p>
        <p id="tomorrow-temperature"></p>
      </section>

      <section class="info-card garbage-card">
        <h3>ごみ</h3>
        <p class="main-info" id="tomorrow-garbage"></p>
      </section>
    </section>
  </main>

  <script>
    "use strict";

    const today = new Date();
    const tomorrow = new Date(today);
    tomorrow.setDate(today.getDate() + 1);

    // ごみの日は、自治会名を確認するまで仮のデータを使います。
    const dashboardData = {
      todayGarbage: "燃やせるごみ",
      tomorrowGarbage: "プラスチック・白トレイ"
    };

    const weatherApiUrl =
      "https://api.open-meteo.com/v1/forecast" +
      "?latitude=36.43" +
      "&longitude=139.91" +
      "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max" +
      "&timezone=Asia%2FTokyo" +
      "&forecast_days=2";

    function formatDate(date) {
      return new Intl.DateTimeFormat("ja-JP", {
        month: "long",
        day: "numeric",
        weekday: "short"
      }).format(date);
    }

    function formatDayHeading(label, date) {
      return `${label}　${formatDate(date)}`;
    }

    function weatherLabel(code) {
      if (code === 0) return "晴れ";
      if (code <= 3) return "くもり";
      if (code <= 49) return "霧";
      if (code <= 67) return "雨";
      if (code <= 77) return "雪";
      if (code <= 82) return "にわか雨";
      if (code <= 86) return "にわか雪";
      if (code <= 99) return "雷雨";
      return "不明";
    }

    function weatherClass(code) {
      if (code === 0) return "sunny";
      if (code <= 49) return "cloudy";
      if (code <= 82) return "rainy";
      if (code <= 86) return "snowy";
      return "stormy";
    }

    function weatherIcon(code) {
      if (code === 0) return "☀";
      if (code <= 49) return "☁";
      if (code <= 82) return "☂";
      if (code <= 86) return "❄";
      return "⚡";
    }

    function setText(id, text) {
      const element = document.getElementById(id);
      if (element) element.textContent = text;
    }

    function displayWeather(dayIndex, daily, dayName) {
      const weatherCode = daily.weather_code[dayIndex];
      const high = Math.round(daily.temperature_2m_max[dayIndex]);
      const low = Math.round(daily.temperature_2m_min[dayIndex]);
      const rain = daily.precipitation_probability_max[dayIndex];

      setText(`${dayName}-weather`, weatherLabel(weatherCode));
      setText(`${dayName}-weather-icon`, weatherIcon(weatherCode));
      setText(
        `${dayName}-temperature`,
        `最高 ${high}℃ / 最低 ${low}℃ / 降水確率 ${rain}%`
      );

      const card = document.getElementById(`${dayName}-weather-card`);
      if (card) {
        card.classList.remove("sunny", "cloudy", "rainy", "snowy", "stormy");
        card.classList.add(weatherClass(weatherCode));
      }
    }

    async function updateWeather() {
      const status = document.getElementById("status");

      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 10000);

        const response = await fetch(weatherApiUrl, {
          method: "GET",
          cache: "no-store",
          signal: controller.signal
        });

        clearTimeout(timeoutId);

        if (!response.ok) {
          throw new Error(`天気APIエラー: HTTP ${response.status}`);
        }

        const data = await response.json();

        if (!data.daily || data.daily.weather_code.length < 2) {
          throw new Error("天気データの形式が正しくありません。");
        }

        displayWeather(0, data.daily, "today");
        displayWeather(1, data.daily, "tomorrow");

        if (status) {
          status.textContent = "最新の天気情報を取得しました";
          setTimeout(() => status.classList.add("hidden"), 1500);
        }
      } catch (error) {
        console.error("天気情報の取得に失敗しました:", error);
        setText("today-weather", "天気を取得できません");
        setText("tomorrow-weather", "天気を取得できません");
        setText("today-temperature", "しばらくして再読み込みしてください");
        setText("tomorrow-temperature", "しばらくして再読み込みしてください");

        if (status) {
          status.textContent = "天気情報を取得できませんでした";
        }
      }
    }

    // HTMLの読み込みが完了してから実行します。
    document.addEventListener("DOMContentLoaded", () => {
      setText("today-date", formatDayHeading("今日", today));
      setText("tomorrow-date", formatDayHeading("明日", tomorrow));
      setText("today-garbage", dashboardData.todayGarbage);
      setText("tomorrow-garbage", dashboardData.tomorrowGarbage);
      updateWeather();
    });
  </script>
</body>
</html>
