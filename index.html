<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>くらしの情報</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 20px; background: #f5f5f5; color: #333;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue",
        "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
    }
    .dashboard { max-width: 600px; margin: 0 auto; }
    .day-card {
      margin-bottom: 20px; padding: 18px; background: #fff;
      border-radius: 18px; box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }
    .day-date { margin: 0 0 14px; font-size: 1.35rem; font-weight: 700; }
    .info-card { padding: 18px; border-radius: 14px; background: #f8f8f8; }
    .weather-icon { display: block; margin-bottom: 8px; font-size: 3rem; line-height: 1; }
    .main-info { margin: 8px 0 0; font-size: 1.25rem; font-weight: 700; }
    #today-temperature, #tomorrow-temperature { margin: 8px 0 0; font-size: 1rem; color: #666; }
    .garbage-card { margin-top: 12px; }
    .garbage-card .main-info { font-size: 1.1rem; }
    .status { margin-top: 12px; font-size: .85rem; color: #777; text-align: center; }
  </style>
</head>
<body>
  <main class="dashboard">
    <section class="day-card">
      <h2 class="day-date" id="today-date"></h2>
      <section class="info-card weather-card">
        <span class="weather-icon" id="today-weather-icon" aria-hidden="true">…</span>
        <p class="main-info" id="today-weather">読み込んでいます…</p>
        <p id="today-temperature"></p>
      </section>
      <section class="info-card garbage-card">
        <p class="main-info" id="today-garbage"></p>
      </section>
    </section>

    <section class="day-card">
      <h2 class="day-date" id="tomorrow-date"></h2>
      <section class="info-card weather-card">
        <span class="weather-icon" id="tomorrow-weather-icon" aria-hidden="true">…</span>
        <p class="main-info" id="tomorrow-weather">読み込んでいます…</p>
        <p id="tomorrow-temperature"></p>
      </section>
      <section class="info-card garbage-card">
        <p class="main-info" id="tomorrow-garbage"></p>
      </section>
    </section>
    <p class="status" id="status"></p>
  </main>

  <script>
    const today = new Date();
    const tomorrow = new Date(today);
    tomorrow.setDate(today.getDate() + 1);

    // 現在は仮のごみ収集データです。
    const garbageData = {
      todayGarbage: "燃やせるごみ",
      tomorrowGarbage: "プラスチック・白トレイ"
    };

    const weatherUrl =
      "https://api.open-meteo.com/v1/forecast" +
      "?latitude=36.43&longitude=139.91" +
      "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max" +
      "&timezone=Asia%2FTokyo&forecast_days=2";

    function formatDate(date) {
      return new Intl.DateTimeFormat("ja-JP", {
        month: "long", day: "numeric", weekday: "short"
      }).format(date);
    }

    function weatherLabel(code) {
      if (code === 0) return "快晴";
      if (code === 1) return "晴れ";
      if (code === 2) return "晴れ時々くもり";
      if (code === 3) return "くもり";
      if ([45,48].includes(code)) return "霧";
      if ([51,53,55].includes(code)) return "霧雨";
      if ([56,57].includes(code)) return "凍る霧雨";
      if ([61,63,65].includes(code)) return "雨";
      if ([66,67].includes(code)) return "凍る雨";
      if ([71,73,75,77].includes(code)) return "雪";
      if ([80,81,82].includes(code)) return "にわか雨";
      if ([85,86].includes(code)) return "にわか雪";
      if ([95,96,99].includes(code)) return "雷雨";
      return "天気情報なし";
    }

    function weatherIcon(code) {
      if (code === 0) return "☀️";
      if ([1,2].includes(code)) return "🌤️";
      if (code === 3) return "☁️";
      if ([45,48].includes(code)) return "🌫️";
      if ([51,53,55,56,57].includes(code)) return "🌦️";
      if ([61,63,65,66,67,80,81,82].includes(code)) return "🌧️";
      if ([71,73,75,77,85,86].includes(code)) return "❄️";
      if ([95,96,99].includes(code)) return "⛈️";
      return "🌤️";
    }

    function displayWeather(index, daily, prefix) {
      const code = daily.weather_code[index];
      const max = Math.round(daily.temperature_2m_max[index]);
      const min = Math.round(daily.temperature_2m_min[index]);
      const rain = daily.precipitation_probability_max[index];

      document.getElementById(prefix + "-weather-icon").textContent = weatherIcon(code);
      document.getElementById(prefix + "-weather").textContent = weatherLabel(code);
      document.getElementById(prefix + "-temperature").textContent =
        "最高 " + max + "℃ / 最低 " + min + "℃　降水確率 " + rain + "%";
    }

    async function updateWeather() {
      const status = document.getElementById("status");
      try {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 10000);
        const response = await fetch(weatherUrl, { signal: controller.signal });
        clearTimeout(timeout);

        if (!response.ok) throw new Error("天気情報の取得に失敗しました");
        const data = await response.json();
        if (!data.daily || data.daily.weather_code.length < 2) {
          throw new Error("天気データがありません");
        }

        displayWeather(0, data.daily, "today");
        displayWeather(1, data.daily, "tomorrow");
        status.textContent = "天気情報を更新しました";
      } catch (error) {
        console.error(error);
        document.getElementById("today-weather").textContent = "天気を取得できません";
        document.getElementById("tomorrow-weather").textContent = "天気を取得できません";
        status.textContent = "天気情報の取得に失敗しました。時間をおいて再読み込みしてください。";
      }
    }

    document.getElementById("today-date").textContent = formatDate(today);
    document.getElementById("tomorrow-date").textContent = formatDate(tomorrow);
    document.getElementById("today-garbage").textContent = garbageData.todayGarbage;
    document.getElementById("tomorrow-garbage").textContent = garbageData.tomorrowGarbage;
    updateWeather();
  </script>
</body>
</html>
